name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use for testing'
        required: false
        default: '3.10'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        uv venv
        source .venv/bin/activate
        uv pip install -e ".[dev]"

    - name: Run lint
      shell: bash
      run: |
        source .venv/bin/activate
        ruff check src tests noxfile.py

    - name: Run tests
      shell: bash
      run: |
        source .venv/bin/activate
        pytest --cov=src/shotgrid_query --cov-report=term-missing

    - name: Run type check
      shell: bash
      run: |
        source .venv/bin/activate
        mypy src/shotgrid_query

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install build tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build package
      shell: bash
      run: python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment:
      name: pypi
      url: https://pypi.org/p/shotgrid-query
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        verbose: true
        print-hash: true

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: get_tag_name
      uses: olegtarasov/get-tag@v2.1.4
      with:
        tagRegex: "v(?<version>.*)"

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Generate changelog
      id: changelog
      uses: jaywcjlove/changelog-generator@main
      continue-on-error: true
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        filter-author: (|dependabot|renovate\[bot\]|dependabot\[bot\]|Renovate Bot)
        filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'
        template: |
          ## ShotGrid Query Builder ${{ steps.get_tag_name.outputs.version }}

          A Pythonic query builder and ORM-like abstraction layer for ShotGrid/Flow Production Tracking API.

          ## Bugs
          {{fix}}
          ## Feature
          {{feat}}
          ## Improve
          {{refactor,perf,clean}}
          ## Misc
          {{chore,style,ci||🔶 Nothing change}}
          ## Unknown
          {{__unknown__}}

    - name: Set default changelog if generation failed
      id: set_changelog
      if: steps.changelog.outcome == 'failure'
      run: |
        echo "changelog=## What's Changed\n\nThis is the first release of ShotGrid Query Builder.\n\nA Pythonic query builder and ORM-like abstraction layer for ShotGrid/Flow Production Tracking API.\n\nSee the full commit history for details." >> $GITHUB_OUTPUT
        echo "compareurl=${{ github.server_url }}/${{ github.repository }}/commits/v${{ steps.get_tag_name.outputs.version }}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/*"
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          Comparing Changes: ${{ steps.changelog.outputs.compareurl || steps.set_changelog.outputs.compareurl }}

          ${{ steps.changelog.outputs.changelog || steps.set_changelog.outputs.changelog }}

