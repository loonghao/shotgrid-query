name: Auto Tag and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-tag:
    name: Create tag from version
    runs-on: ubuntu-latest
    outputs:
      tag_created: ${{ steps.tag_check.outputs.tag_created }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Get version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(grep -m 1 'version = ' pyproject.toml | cut -d '"' -f 2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $VERSION"

    - name: Check if tag exists
      id: tag_check
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        TAG="v$VERSION"
        
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists"
          echo "tag_created=false" >> $GITHUB_OUTPUT
        else
          echo "Creating new tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release version $VERSION"
          git push origin "$TAG"
          echo "tag_created=true" >> $GITHUB_OUTPUT
        fi

  trigger-publish:
    name: Trigger publish workflow
    needs: auto-tag
    if: needs.auto-tag.outputs.tag_created == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Wait for tag to be available
      run: sleep 5

    - name: Trigger publish workflow
      run: |
        echo "Tag v${{ needs.auto-tag.outputs.version }} created successfully"
        echo "Publish workflow will be triggered automatically"

